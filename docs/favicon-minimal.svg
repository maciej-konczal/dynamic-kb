<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 32 32">
  <defs>
    <linearGradient id="grad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#6366f1"/>
      <stop offset="100%" style="stop-color:#8b5cf6"/>
    </linearGradient>
  </defs>
  <!-- Rounded square -->
  <rect x="2" y="2" width="28" height="28" rx="7" fill="url(#grad)"/>
  <!-- Stylized "d" -->
  <text x="9" y="24" font-family="Georgia, serif" font-size="22" font-weight="bold" fill="white">d</text>
  <!-- Motion lines (dynamic) -->
  <line x1="22" y1="10" x2="26" y2="10" stroke="white" stroke-width="2" stroke-linecap="round" opacity="0.8"/>
  <line x1="23" y1="14" x2="27" y2="14" stroke="white" stroke-width="2" stroke-linecap="round" opacity="0.6"/>
  <line x1="22" y1="18" x2="26" y2="18" stroke="white" stroke-width="2" stroke-linecap="round" opacity="0.4"/>
</svg>